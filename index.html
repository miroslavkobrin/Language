<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <script src="jquery-4.0.0.min.js"></script>
    
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .main-wrapper {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            padding: 20px;
        }

        .level-panel {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            min-width: 200px;
        }
        .level-panel h3 { margin-top: 0; font-size: 18px; }
        .level-panel label { display: block; margin: 10px 0; cursor: pointer; }

        .game-area {
            width: 400px;
            text-align: center;
        }

        .word-card {
            background: #fff;
            padding: 60px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            font-size: 32px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            user-select: none; 
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #007bff;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
        }

        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }
        .arrow {
            cursor: pointer;
            font-size: 24px;
            user-select: none;
        }
        .arrow:hover { color: #007bff; }

        .stats-btn {
            background: none;
            border: none;
            color: #0000ff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            padding: 0 10px;
        }
        .correct-text { color: #28a745; }
        .wrong-text { color: #dc3545; }

        @media (max-width: 700px) {
            .main-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .game-area { width: 100%; max-width: 400px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <div class="level-panel">
            <h3>Рівень складності</h3>
            <label><input type="radio" name="level" value="easy" checked> Початковий</label>
            <label><input type="radio" name="level" value="medium"> Середній</label>
            <label><input type="radio" name="level" value="hard"> Високий</label>
        </div>

        <div class="game-area">
            <div class="step-counter">Слово: <span id="currentStepText">1</span>/10</div>
            <div class="word-card" id="card">Завантаження...</div>
            <input type="text" id="userInput" placeholder="Введіть переклад...">
            
            <div class="navigation">
                <span id="prevBtn" class="arrow">←</span>
                <span><span id="navStepText">1</span>/10</span>
                <span id="nextBtn" class="arrow">→</span>
            </div>
            
            <button id="statsBtn" class="stats-btn">Статистика</button>
            
            <div class="stats">
                <span class="correct-text">Вірно: <span id="correctCount">0</span></span>
                <span class="wrong-text">Невірно: <span id="wrongCount">0</span></span>
            </div>
        </div>

    </div>
    <script src="Lr12.js"></script>
</body>
</html>
